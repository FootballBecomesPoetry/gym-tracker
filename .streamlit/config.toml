# Save this as .streamlit/config.toml (same folder as secrets.toml)
# It makes Streamlit's own widgets match the blue/violet palette used by
# Momentum's custom components, instead of clashing with it.

[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b26"
textColor = "#e6edf3"
font = "sans serif"

[client]
toolbarMode = "minimal"